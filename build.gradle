plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.144'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

def modVersion = project.findProperty("mod_version") ?: "1.0.21"
version = "neoforge-1.20.1-$modVersion"
group = 'net.celsiusqc.cp_tweaks'

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.20.1, so mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    // Specify the version of MinecraftForge to use.
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up 'localRuntime'/'modLocalRuntime' for runtime-only optional dependencies
// that should not be pulled in transitively by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

repositories {
    maven { url "https://www.cursemaven.com" }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com'
    }
}

dependencies {
    // Soft integrations — compile-time only, gated at runtime by ModList checks.
    // See CLAUDE.md's integration matrix for what each unlocks.
    modCompileOnly "curse.maven:create-328085:4626108"
    modCompileOnly "curse.maven:ad-astra-635042:5116766"
    modCompileOnly "curse.maven:ad-astra-rocketed-996980:5245376"
    modCompileOnly "curse.maven:alexs-mobs-426558:4618074"
    modCompileOnly "curse.maven:citadel-331936:4613231"
    modCompileOnly "curse.maven:serene-seasons-291874:4611121"
    modCompileOnly "curse.maven:l_ender-s-cataclysm-551586:4665435"
    modCompileOnly "curse.maven:the-twilight-forest-227639:5071019"
    modCompileOnly "curse.maven:blue-skies-312918:5010316"
    modCompileOnly "curse.maven:structure-gel-api-378802:5188368"
    modCompileOnly 'software.bernie.geckolib:geckolib-forge-1.20:4.2'

    modLocalRuntime "curse.maven:create-328085:4626108"
    modLocalRuntime "curse.maven:ad-astra-635042:5116766"
    modLocalRuntime "curse.maven:ad-astra-rocketed-996980:5245376"
    modLocalRuntime "curse.maven:resourceful-lib-570073:5210240"
    modLocalRuntime "curse.maven:resourceful-config-714059:5020441"
    modLocalRuntime "curse.maven:botarium-704113:5118353"
    modLocalRuntime "curse.maven:alexs-mobs-426558:4618074"
    modLocalRuntime "curse.maven:citadel-331936:4613231"
    modLocalRuntime "curse.maven:serene-seasons-291874:4611121"
    modLocalRuntime "curse.maven:l_ender-s-cataclysm-551586:4665435"
    modLocalRuntime "curse.maven:the-twilight-forest-227639:5071019"
    modLocalRuntime "curse.maven:blue-skies-312918:5010316"
    modLocalRuntime "curse.maven:structure-gel-api-378802:5188368"
    modLocalRuntime 'software.bernie.geckolib:geckolib-forge-1.20:4.2'

    modCompileOnly "mezz.jei:jei-1.20.1-common-api:15.2.0.23"
    modCompileOnly "mezz.jei:jei-1.20.1-forge-api:15.2.0.23"
    modLocalRuntime "mezz.jei:jei-1.20.1-forge:15.2.0.23"
    modLocalRuntime "curse.maven:just-enough-resources-jer-240630:4631691"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
